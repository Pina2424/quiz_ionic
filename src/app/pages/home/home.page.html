<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Super Quiz App
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <div class="ion-text-center ion-padding">
    <h2>Willkommen zum Quiz!</h2>
    <p>Anzahl Fragen: {{ data.currentQuiz.questions.length }}</p>
  </div>

  <!-- Кнопка запуска квиза через метод в TypeScript -->
<ion-button expand="block" color="primary" (click)="startQuiz()" class="ion-margin-top">
  🚀 Start Quiz
</ion-button>

  <!-- Кнопка перехода к списку вопросов (если вы её делали с учителем) -->
  <ion-button expand="block" color="secondary" routerLink="/quiesten-list" class="ion-margin-top">
    📝 Fragen verwalten (Liste)
  </ion-button>

  <!-- Кнопка загрузки из JSON (если нужно подгружать с сервера) -->
  <ion-button expand="block" color="tertiary" (click)="data.loadJSON()" class="ion-margin-top">
    📥 Load Quiz from Server
  </ion-button>

</ion-content>
