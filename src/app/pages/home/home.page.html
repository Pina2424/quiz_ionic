<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Super Quiz App
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

<ion-button expand="block"color="primary" routerLink="/question">
    Start Quiz
 Lala 
</ion-button>
  <div id="container">
    
    <strong>Ready to create an app?</strong>
    <p>Start with Ionic <a target="_blank" rel="noopener noreferrer" href="https://ionicframework.com/docs/components">UI Components</a></p>
  </div>
  <ion-content [fullscreen]="true">
    <p>Aktuelle Quiz: {{data.currentQuiz.quizName}} Anzahl Fragen: {{data.currentQuiz.questions.length}} </p>
    <ion-button expand="block" color="secondary" (click)="showQuestions()">
  Показать вопросы
</ion-button>
   
   <ion-button expand="block" color="tertiary" (click)="data.loadJSON()">
     Load Quiz
   </ion-button>
  </ion-content>
</ion-content>
