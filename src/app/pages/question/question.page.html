

<ion-header [translucent]="true">

  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Question</ion-title>
    
    
 
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
<ion-list>
  <ion-item>
   <ion-label position="fixed"> ID:</ion-label>
   <ion-label>{{question.id}} </ion-label> 

  </ion-item>
<ion-item>
   <ion-label position="fixed"> Title:</ion-label>
   <ion-input [(ngModel)]="question.titel">
   </ion-input>
  </ion-item>

  <ion-item>
   <ion-label position="fixed"> Answer 1:</ion-label>
   <ion-input [(ngModel)]="question.a1">
   </ion-input>
  </ion-item>
  <ion-item>
   <ion-label position="fixed"> Answer 2:</ion-label>
   <ion-input [(ngModel)]="question.a2">
   </ion-input> 
  </ion-item>
  <ion-item>
   <ion-label position="fixed"> Answer 3:</ion-label>
   <ion-input [(ngModel)]="question.a3">
   </ion-input>
  </ion-item>
  <ion-item>
   <ion-label position="fixed"> Answer 4:</ion-label>
   <ion-input [(ngModel)]="question.a4">
   </ion-input>
  </ion-item>
  <ion-item>
   <ion-label position="fixed"> Correct Answer:</ion-label>
   <ion-input type="number" [(ngModel)]="question.correct">
   </ion-input>
  </ion-item>
</ion-list>
</ion-content>
